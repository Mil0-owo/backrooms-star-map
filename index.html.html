        var edges = new vis.DataSet([{"from": "level-263", "to": "level-38", "title": "通过在Level 0到Level 37之间的任意层级游荡即可进入Level 38。前进时，流浪者可能会注意到景观的变化，周围的事物更加混乱，通常充满了与总体环境不协调的矛盾事物与奇怪穿插。不过，在这样做时，也有可能会抵达 Level 263 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-3", "to": "level-4", "title": "Level 4 偶尔会有出口通向 Level 5 和 Level 6 。大多数出口以办公室风格的楼梯状态出现，有时也会以通向 Level 3 的电梯形象出现。很少情况下，可以找到通往地下室的楼梯，他们将带你去到 Level 71 。跟后室中其他很多出口一样，一旦你失去对出口的视野，它们可能会出其不意地消失。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-141", "to": "latest:level-11", "title": "Level 141 随机的门通向 Level 11。 Level 330 的门亦然。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-5", "to": "level-82", "title": "Level 82 里“入口大厅”上的一扇门有极低概率可以通向 Level 5 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-87", "to": "level-9", "title": "打破 Level 87 的窗户可以来到 Level 9 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-39", "to": "level-129", "title": "如果边界区域开始下雪，那么便可以直接进入 Level 129 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-2", "to": "level-137", "title": "Level 31 、 level-127 与 Level 137", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-13", "to": "level-0", "title": "能够从单调、不显眼的门离开 Le ity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-60", "to": "level-61", "title": "跳入处于“状态二”的“海”，就有机会到达 Level 7 。有种假说称，如果在 Level 60 的上层区域睡着，就会在 Level 61 中醒来。该假说未经证实，不建议如此尝试，以免被敌对实体攻击。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "trimmed:level-409", "to": "level-1", "title": "Level 409 - “纸屋” 中的纸板门；", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-39", "to": "level-170", "title": "切出 Level 39 的树木偶尔会将你带到 Level 170 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-5", "to": "level-41", "title": "在 Level 5 的锅炉房中，焦油偶尔会取代 杏仁水 从交织的管道中滴落。 站在其滴落处下方会把你传送进Level 41。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "trimmed:level-563", "to": "latest:level-11", "title": "走向 Level 563 类似于城市的景观（数十英里后）会到达 Level 11。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-19", "to": "level-18", "title": "人们注意到，出口在一些十分显眼的地方。最简单的方法是转身离开，这将带你来到 Level 19 。如果你碰巧遇到 毛绒恐龙 ，你可以跟随它一段时间，这将带你到达你想要去的层级。但这种方法有时会花费很长的时间。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-1", "to": "level-710", "title": "触摸属于朝圣者之路上的地标可以让你切入另一个包含地标的层级。继续如此做，最终你将抵达 Level 710 - “戒与荒域” ；", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "latest:level-11", "to": "level-232", "title": "标有着 “娱乐区” 的建筑无一例外地通向 Level 20 。被称作 “卡西皮安古董行” 的建筑通向 Level 232 ，而标示着 “佩德罗帕帕披排铺” 的建筑通向 Level 458 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "latest:level-11", "to": "level-119", "title": "Level 11 的供水站通向 Level 119 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-283", "to": "level-4", "title": "有许多抵达这一层级的方法，最广为人知的一种办法是从 枢纽 的墙上跃进这一层级。你也可以通过 Level 3 的电梯或者 Level 2 中未上锁的门来到此。掉入 Level 283 的海洋球池中有几率被传送穿过 Level 4 的天花板。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "latest:level-11", "to": "level-48", "title": "如果有人找到被沙子覆盖的房间，或用沙子填满房间，并在里面入睡，其在醒来后会出现在 Level 48 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-852", "to": "level-70", "title": "触碰 Level 43 、 Level 852 或 Level 979 内一幅描绘雪景且被置于怪异位置的画会将流浪者传送至本层级。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-57", "to": "level-c-5", "title": "看到 Level 57 画廊中墙上的那幅画有彩色色块的油画了吗？对，就是那里！就是那里！！盯住它或者穿过它，你将幸运地到达这里！！！", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-1", "to": "level-57", "title": "通往 Level 24 - “月球” 的入口被 B.N.T.G. 保密，但有传言说是类似于切入 Level 57 上的月球画作；", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-c-11", "to": "level-c-12", "title": "拍摄一张房屋的照片，并在其中写上 Level C-11 ，11分钟后将会被传送至Level C-11，此方法仅限按照Level C-11档案进行操作，且至少离开过一次Level C-11的人员。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-1", "to": "old:level-800", "title": "爬入开放式通风管道将进入 level-800 - “钟表之屋”。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-70", "to": "level-0", "title": "建筑物内的某些门有概率将流浪者领至 Level 0 、 Level 13 、 Level 37 、 Level 120 ，或 Level 427 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-4", "to": "latest:level-3", "title": "Level 4 或 Level 5 中任何不是 Entity 81 实例的电梯都会将流浪者带到 Level 3。其中一部电梯就位于 Gamma 基地内部，被 Omega 基地 20 和“家政服务” 21 定期使用。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-11", "to": "level-2", "title": "在灯具复明后，Level 2内几乎所有的机器都停止了运作，仅会发出来自其内部，好似其结构损坏或是错位的平静涡轮噪声。此外，Level 2尚存灯火未明，仅有少数灯具可以运作的部分，所有的机器及管道都安静无比。因此，尤其是存在着其他如 Level 11 或 Level 186 等更加宜居的层级，许多大小型团体皆计划着迁移至生活条件与补给更好的层级。但B.N.T.G.依然将办公区EL3A用作其主要基地，自大停电后便再未有重要团体占据过Level 2。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-39", "to": "level-300", "title": "偶尔 Level 39 的某些路径上会出现一些随机生成的木板，站在上面便就可以到达 Level 300 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "trimmed:level-135", "to": "level-56", "title": "Level 56 可以通过切入 Level 8 中的明显较冷的部分，或是通过走进 Level 93 、 Level -5 、 Level 420 或 level-135 中的洞穴来进入。洞穴入口也可以在 Level 55 的冰柜中找到。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-726", "to": "level-1", "title": "Level 726 - “只是一间普通的客厅” 中的任意一扇门。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "trimmed:level-4-2", "to": "level-1", "title": "Level 4.2 - “雾都停车场” 中的特定随机门；", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-729", "to": "level-70", "title": "在 Level 2 、 Level 3 、 Level 31 、 Level 208 与 Level 729 内可找到一扇白门，在 Level 9 内亦可找到一扇鲜少出现、刻着数字70的门，进入其可以将流浪者带到 Level 70 内的一栋建筑。有时， Level 39 与 Level 234 内也能找到这类门，其镶嵌于一棵树内。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-7", "to": "level-880", "title": "近期有理论推测， Level 7 或许与其他海洋层级存在着联系。有少数人声称他们从入口房间划船向西移动极远的距离之后，就进入了 Level 880 。该出口的存在尚未得到证实，但是或将成为一个更加安全的离开方式。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-11", "to": "level-1", "title": "一些建筑会通往 Level 0 、 Level 1 、 Level 2 、 Level 3 、 Level 4 与 Level 196 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "latest:level-11", "to": "level-458", "title": "标有着 “娱乐区” 的建筑无一例外地通向 Level 20 。被称作 “卡西皮安古董行” 的建筑通向 Level 232 ，而标示着 “佩德罗帕帕披排铺” 的建筑通向 Level 458 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-162", "to": "level-1", "title": "Level 162 - “混凝土墙” ，在平台副墙移回时，对其切出；", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-c-30", "to": "level-c-30", "title": "“ Level C-30 ”，作者 RZX STORY，来自 后室中文维基 。原文链接： http://backrooms-wiki-cn.wikidot.com/level-c-30 。遵循 CC BY-SA 3.0 协议。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-c-12", "to": "level-c-7", "title": "跳入一个浅水池塘，将会把你传送至 Level C-7 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-1", "to": "level-2", "title": "Level 2 亦称“废弃公共带“，是最常见的出口。这是因为，这里属于“十二大层” 15 的一份子。 Level 1 到 Level 2 的阈界非常稳定，意味着流浪者只需沿着管道与仪表盘逐渐显现的方向移动，走得足够远便可进入“废弃公共带”。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-5", "to": "level-6", "title": "深入锅炉房可以把你带入 Level 6 。但是极度不建议使用此方法离开 Level 5 ，因为锅炉房通常有着极端的高温。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-2", "to": "level-38", "title": "伪层级 与 Level 38", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-64", "to": "level-57", "title": "切入油画可以去往 Level 57 ；", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-62", "to": "level-4", "title": "走进棚屋内，采用从 Level 37 进入本层级的相同方式，便会将你送至 Level 4 或者 Level 10 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-c-19", "to": "level-9", "title": "在某些看不见夕阳的单元中，在城市内的低层楼房里进行切出可能会到达 Level 9 的某个室内。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-11", "to": "level-3", "title": "一些建筑会通往 Level 0 、 Level 1 、 Level 2 、 Level 3 、 Level 4 与 Level 196 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "latest:level-11", "to": "level-109", "title": "外表奇形怪状且“故障”的医院通向 Level 109 。在没有故障的医院探索足够久后有较低机率来到 Level 511 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-13", "to": "level-3", "title": "触摸在 Level 13 中发现的生锈管道有可能会使你入 Level 3 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-2", "to": "level-3", "title": "Level 2 未上锁的门通常通向 Level 3 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-1", "to": "level-38", "title": "在一条故障逐渐加剧的小径上行走，最终将到达 Level 38 - “多叠交点” ；", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-1", "to": "level-352", "title": "以任何使用拉丁字母的语言清晰地说出 bHZsMzUy 的层级名，将开启该层级的阈界 16 ；", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-54", "to": "level-17", "title": "要离开这个层级，需要进入可通往 Level 1 、 Level 4 、 Level 5 、 Level 9 、 Level 17 、 Level 21 、 Level 34 、 Level 43 和 Level 53 的未上锁的门之一。也可以通过触摸地板上的布满灰尘的商店标志来进入 Level 33 ，还可以通过进入被撞毁的火车来进入 Level 61 。", "arrows": "to", "color": {"color": "#888888", "highlight": -62", "to": "level-445", "title": "若于这片森林中持续停留一周，你将会被传送至 Level 445 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-186", "to": "level-2", "title": "在灯具复明后，Level 2内几乎所有的机器都停止了运作，仅会发出来自其内部，好似其结构损坏或是错位的平静涡轮噪声。此外，Level 2尚存灯火未明，仅有少数灯具可以运作的部分，所有的机器及管道都安静无比。因此，尤其是存在着其他如 Level 11 或 Level 186 等更加宜居的层级，许多大小型团体皆计划着迁移至生活条件与补给更好的层级。但B.N.T.G.依然将办公区EL3A用作其主要基地，自大停电后便再未有重要团体占据过Level 2。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-5", "to": "latest:level-3", "title": "Level 4 或 Level 5 中任何不是 Entity 81 实例的电梯都会将流浪者带到 Level 3。其中一部电梯就位于 Gamma 基地内部，被 Omega 基地 20 和“家政服务” 21 定期使用。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "latest:level-11", "to": "level-247", "title": "任何在外观上更为古老的建筑中的现代门 22 都通向 Level 247 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-17", "to": "level-18", "title": "这个层级没有统一的入口，因为它主要基于流浪者本身。最常见的情况是当流浪者回想过去的记忆时，他们就会出现在该层级。然而，有人注意到 Level 17 有一个入口，尽管这很罕见。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-3", "to": "level-69", "title": "坐在电力房中发现的汽车前座上会让你失去知觉。随后你将在 Level 69 醒来。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-5", "to": "level-4", "title": "转身回到带你进入 Level 5 的楼梯，你可以重新进入 Level 4 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0. dth": 0.8}, {"from": "level-1", "to": "level-998-2", "title": "纯白木门将通向 Level 998.2 - “搏击俱乐部” ；", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-67", "to": "level-31", "title": "在 Level 2 或 Level 3 中，有些木门背后会传出音乐声，穿过这样的门即可抵达该层级。不过这类门相当少见。 在 Level 67 食用一份“最不喜欢/最讨厌的面点”，可能会来到该层级。 在 Level 210 触碰一个指向该层级的超链接，即可传送至此。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-330", "to": "latest:level-11", "title": "Level 141 随机的门通向 Level 11。 Level 330 的门亦然。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-52", "to": "level-2", "title": "Level 52", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "latest:level-11", "to": "level-20", "title": "标有着 “娱乐区” 的建筑无一例外地通向 Level 20 。被称作 “卡西皮安古董行” 的建筑通向 Level 232 ，而标示着 “佩德罗帕帕披排铺” 的建筑通向 Level 458 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-9", "to": "level-c-19", "title": "在某些看不见夕阳的单元中，在城市内的低层楼房里进行切出可能会到达 Level 9 的某个室内。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-309", "to": "level-2", "title": "Level 309", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-11", "to": "level-c-8", "title": "在 Level 11 的下水道中向城外方向行进至少300公里后离开下水道，你将在 Level C-8 的某一水井中切入。", "arrows": "to", "color": {"color": "#888888", "highl el 11 的特定巴士可能来到 level-147 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "trimmed:level-135", "to": "level-39", "title": "Level 135 的某些部分有时会连通着你进入 Level 39 。如果天色开始变得越来越暗，太阳突然开始落山，那么这就意味着你正在接近 Level 39 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-852", "to": "level-1", "title": "在 Level 852 - “零售疗法” 里找到促销层，并获取两瓶杏仁水。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-39", "to": "level-466", "title": "掉进 Level 39 的水坑中，将会导致你在 Level 466 的湖边醒来。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-6", "to": "level-41", "title": "Level 6 漆黑的墙壁触感偶尔会由原本的光滑而无特点变得十分黏稠。手上沾染过多来自此种墙面的物质会导致进入Level 41。 这些异常墙壁的位置并不固定，每当流浪者确定墙壁的位置时，它们似乎会从一个区域移动到另一个区域。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-25", "to": "level-c-15", "title": "在 Level 25 中游玩一个叫作 月 的街机会使你进入本层级。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-11", "to": "level-105", "title": "在本层级找到一个大教堂将进入 Level 105 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "latest:level-11", "to": "archived:level-201", "title": "尽管 level-201 的入口在 Level 11 并没有被明确地使用， 23 用来触发该层级入口的录像带能在 Level 11 被找到或购买。同样地，通往 Level 222 的宣传册源自于 Level 11。它们同样也在后室各处被交易或购买。尽管征兵海报无法跨层级交易，但触碰其会来到 Level 49 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-1", "to": "level-1-5", "title": "可通过切出进入 Level 1.5 - “颠倒” 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-499", "to": "level-39", "title": "在 Level 499 中，有的森林地域的顶部有一些洞，当你试图从那里爬出，便会来到 Level 39 的地面。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "old:old:level-61", "to": "level-11", "title": "当 old:level-61 静止时下车在外面走动会进入 Level 11 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-11", "to": "level-13", "title": "进入 Level 11 的某栋公寓楼，可进入 Level 13 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-3", "to": "level-70", "title": "在 Level 2 、 Level 3 、 Level 31 、 Level 208 与 Level 729 内可找到一扇白门，在 Level 9 内亦可找到一扇鲜少出现、刻着数字70的门，进入其可以将流浪者带到 Level 70 内的一栋建筑。有时， Level 39 与 Level 234 内也能找到这类门，其镶嵌于一棵树内。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-c-12", "to": "level-c-11", "title": "拍摄一张房屋的照片，并在其中写上 Level C-11 ，11分钟后将会被传送至Level C-11，此方法仅限按照Level C-11档案进行操作，且至少离开过一次Level C-11的人员。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-2", "to": "level-31", "title": "Level 31 、 level-127 与 Level 137", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-12", "to": "level-1", "title": "Level 12 - “矩阵” 中，特定操作会导致一扇门出现；", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-9", "to": "level-283", "title": "一个飞机场可以在去往 Level 11 的标志的时候被发现。进入飞机场会被传送到 Level 36 。一般情况下在此切出将会来到开始几个负数层级。找到一个运动场并且在任何一条有着白色的发光内窗的管道中爬行通常会传送到 Level 283 的管道中。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}, {"from": "level-16", "to": "level-46", "title": "找到并爬上一棵覆盖有沙子的树会将你带往 Level 46 。", "arrows": "to", "color": {"color": "#888888", "highlight": "#ffffff", "opacity": 0.4}, "smooth": {"type": "continuous", "roundness": 0.2}, "width": 0.8}]);

        var container = document.getElementById('network');
        var data = { nodes: nodes, edges: edges };

        var options = {
            nodes: {
                shape: 'dot',
                size: 20,
                font: { color: '#ffffff', size: 12, face: 'Arial' },
                borderWidth: 2,
                borderWidthSelected: 4,
                shadow: {
                    enabled: true,
                    color: 'rgba(0,0,0,0.5)',
                    size: 8,
                    x: 0,
                    y: 0
                }
            },
            edges: {
                color: {
                    color: '#888888',
                    highlight: '#ffffff',
                    opacity: 0.4
                },
                width: 0.8,
                smooth: {
                    type: 'continuous',
                    roundness: 0.2
                },
                arrows: {
                    to: { enabled: true, scaleFactor: 0.4 }
                }
            },
            physics: {
                stabilization: { enabled: true, iterations: 300 },
                barnesHut: {
                    gravitationalConstant: -6000,
                    springConstant: 0.02,
                    springLength: 200,
                    damping: 0.12,
                    centralGravity: 0.1
                },
                minVelocity: 0.75
            },
            interaction: {
                hover: true,
                tooltipDelay: 100,
                zoomView: true,
                dragView: true,
                navigationButtons: true,
                keyboard: true
            }
        };

        var network = new vis.Network(container, data, options);

        network.on("click", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var url = "https://backrooms-wiki-cn.wikidot.com/" + nodeId;
                window.open(url, "_blank");
            }
        });

        // 搜索高亮功能
        var searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', function() {
            var keyword = this.value.toLowerCase();
            var matchedNodeIds = [];
            nodes.forEach(function(node) {
                if (node.id.toLowerCase().includes(keyword) || (node.title && node.title.toLowerCase().includes(keyword))) {
                    matchedNodeIds.push(node.id);
                }
            });

            var updatedNodes = [];
            nodes.forEach(function(node) {
                if (matchedNodeIds.includes(node.id)) {
                    updatedNodes.push({...node, opacity: 1, borderWidth: 4, borderWidthSelected: 4});
                } else {
                    updatedNodes.push({...node, opacity: 0.2, borderWidth: 2});
                }
            });
            nodes.update(updatedNodes);

            if (matchedNodeIds.length === 1) {
                network.focus(matchedNodeIds[0], {scale: 1.2, animation: true});
            }
        });
    </script>
