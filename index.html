<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>后室层级星图</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #1c1c1c 0%, #0a0a0a 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #search-container {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
        }
        #search-input {
            padding: 8px 12px;
            width: 250px;
            border-radius: 20px;
            border: 1px solid #555;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        #search-input::placeholder {
            color: #aaa;
        }
        #network {
            width: 100vw;
            height: 100vh;
            border: none;
        }
        .vis-tooltip {
            background: rgba(0,0,0,0.85) !important;
            color: #fff !important;
            border-radius: 5px !important;
            padding: 6px 10px !important;
            font-size: 13px !important;
            border: 1px solid #555 !important;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            z-index: 2000;
        }
    </style>
</head>
<body>
    <div id="search-container">
        <input type="text" id="search-input" placeholder="搜索层级名称...">
    </div>
    <div id="network"></div>
    <div id="loading">加载中...</div>
    <script>
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                initGraph(data);
            })
            .catch(err => {
                document.getElementById('loading').textContent = '加载失败: ' + err;
            });

        function initGraph(data) {
            var nodes = new vis.DataSet(data.nodes);
            var edges = new vis.DataSet(data.edges);

            var container = document.getElementById('network');

            var options = {
                nodes: {
                    shape: 'dot',
                    size: 8,
                    font: {
                        color: '#ffffff',
                        size: 12,
                        face: 'Arial'
                    },
                    borderWidth: 1,
                    borderWidthSelected: 3,
                    shadow: {
                        enabled: true,
                        color: 'rgba(0,0,0,0.3)',
                        size: 5,
                        x: 0,
                        y: 0
                    },
                    scaling: {
                        min: 5,
                        max: 50,
                        label: {
                            enabled: true,
                            min: 10,
                            max: 50,
                            maxVisible: 30,
                            drawThreshold: 12
                        }
                    }
                },
                edges: {
                    color: {
                        color: '#888888',
                        highlight: '#ffffff',
                        opacity: 0.15
                    },
                    width: 0.5,
                    smooth: {
                        type: 'continuous',
                        roundness: 0.1
                    },
                    arrows: {
                        to: { enabled: true, scaleFactor: 0.3 }
                    }
                },
                physics: {
                    stabilization: { enabled: true, iterations: 500 },
                    barnesHut: {
                        gravitationalConstant: -1500,
                        springConstant: 0.005,
                        springLength: 250,
                        damping: 0.12,
                        centralGravity: 0.05
                    },
                    minVelocity: 0.5,
                    maxVelocity: 30
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 100,
                    zoomView: true,
                    dragView: true,
                    navigationButtons: true,
                    keyboard: {
                        enabled: true,
                        bindToWindow: false
                    }
                },
                clustering: {
                    enabled: true,
                    initialMaxNodes: 100,
                    clusterThreshold: 200,
                    clusterNodeProperties: {
                        shape: 'dot',
                        size: 20,
                        color: '#ff9800',
                        borderWidth: 2,
                        font: { size: 16, color: '#fff' }
                    }
                }
            };

            var network = new vis.Network(container, data, options);

            network.on("click", function(params) {
                if (params.nodes.length > 0) {
                    var nodeId = params.nodes[0];
                    var url = "https://backrooms-wiki-cn.wikidot.com/" + nodeId;
                    window.open(url, "_blank");
                }
            });

            var searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', function() {
                var keyword = this.value.toLowerCase();
                var matchedNodeIds = [];
                nodes.forEach(function(node) {
                    if (node.id.toLowerCase().includes(keyword) ||
                        (node.title && node.title.toLowerCase().includes(keyword)) ||
                        (node.label && node.label.toLowerCase().includes(keyword))) {
                        matchedNodeIds.push(node.id);
                    }
                });

                var updatedNodes = [];
                nodes.forEach(function(node) {
                    if (matchedNodeIds.includes(node.id)) {
                        updatedNodes.push({...node, opacity: 1, borderWidth: 4, borderWidthSelected: 4});
                    } else {
                        updatedNodes.push({...node, opacity: 0.15, borderWidth: 1});
                    }
                });
                nodes.update(updatedNodes);

                if (matchedNodeIds.length === 1) {
                    network.focus(matchedNodeIds[0], {scale: 1.2, animation: true});
                }
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === '+' || e.key === '-' || e.key === '=') {
                    e.stopPropagation();
                }
            });
        }
    </script>
</body>
</html>
